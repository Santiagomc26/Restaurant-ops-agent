[project]
name = "restaurant-ops-agent"
version = "0.1.0"
description = "Agente de operaciones para restaurantes: pedidos por WhatsApp con tool calling, inventario por API y pronóstico de demanda."
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
